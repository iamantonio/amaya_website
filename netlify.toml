# Netlify configuration for amayavargas.com
# Static site: compiled CSS (css/styles.css) is committed, so no build step.
# To change styles, edit src/input.css and run `npm run build` locally, then commit.

[build]
  publish = "."

# Card print sheet is for local printing only — keep it out of search engines.
[[headers]]
  for = "/card-print.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Sensible security headers for a static site
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
