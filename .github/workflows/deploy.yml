name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inline CSS + cache-bust JS
        # Inline the compiled stylesheet into <head> so first paint isn't blocked by a
        # render-blocking CSS request on slow links (the big mobile-cold-load win). JS keeps
        # a per-deploy version so browsers never mix new HTML with stale JS.
        run: |
          node scripts/inline-css.js
          V="${GITHUB_SHA::8}"
          sed -i "s|src=\"js/main.js\"|src=\"js/main.js?v=$V\"|" index.html

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 5.161.123.224 >> ~/.ssh/known_hosts

      - name: Rsync site to VPS
        run: |
          rsync -avz --delete \
            --exclude '.git*' --exclude 'node_modules' --exclude 'src' --exclude 'docs' \
            --exclude '.claude' --exclude '.tldr*' --exclude 'package*.json' \
            --exclude 'tailwind.config.js' --exclude '*.md' --exclude 'scripts' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ deploy@5.161.123.224:/var/www/amayavargas.com/
